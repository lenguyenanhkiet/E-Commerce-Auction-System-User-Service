syntax = "proto3";

option csharp_namespace = "ECommerceAuction.UserService.Api.Grpc";

package ecommerce.user.internal.v1;

service InternalHealth {
  rpc Check (InternalHealthRequest) returns (InternalHealthReply);
}

message InternalHealthRequest {
  string caller = 1;
}

message InternalHealthReply {
  string service = 1;
  string status = 2;
  string checked_at_utc = 3;
}
