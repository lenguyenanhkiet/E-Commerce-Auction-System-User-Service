stages:
  - build_and_push
  - deploy_staging

variables:
  DOCKER_IMAGE_NAME: $DOCKER_HUB_USER/user-service:$CI_COMMIT_SHORT_SHA

  SERVICE_NAME_STAGING: "user-service-staging"
  TARGET_PORT: "8080"

# --- STAGE 1: DOCKERIZE & PUSH TO DOCKER HUB ---
dockerize:
  stage: build_and_push
  script:
    - echo "Building Docker image..."
    # Log in Docker Hub
    - docker login -u $env:DOCKER_HUB_USER -p $env:DOCKER_HUB_PASS
    - docker build -t $env:DOCKER_IMAGE_NAME .
    - echo "Pushing Image to Docker Hub..."
    - docker push $env:DOCKER_IMAGE_NAME
  only:
    - staging

# --- STAGE 2: DEPLOY TO AZURE CONTAINER APPS ---
deploy_to_azure:
  stage: deploy_staging
  script:
    - echo "Connecting to Azure..."
    - $azureCreds = $env:AZURE_CREDENTIALS | ConvertFrom-Json
    - az login --service-principal -u $azureCreds.clientId -p $azureCreds.clientSecret --tenant $azureCreds.tenantId
    - |
      az containerapp show -n $env:SERVICE_NAME_STAGING -g $env:AZURE_RESOURCE_GROUP 2> $null
      if ($LASTEXITCODE -eq 0) {
          echo "Service already exists. Updating to the new version..."
          az containerapp update --name $env:SERVICE_NAME_STAGING --resource-group $env:AZURE_RESOURCE_GROUP --image $env:DOCKER_IMAGE_NAME --set-env-vars "ConnectionStrings__DefaultConnection=$env:DB_CONNECTION_STRING"
      } else {
          echo "Service does not exist. Initializing for the first time..."
          az containerapp create --name $env:SERVICE_NAME_STAGING --resource-group $env:AZURE_RESOURCE_GROUP --environment $env:AZURE_ENV_NAME --image $env:DOCKER_IMAGE_NAME --ingress external --target-port $env:TARGET_PORT --env-vars "ConnectionStrings__DefaultConnection=$env:DB_CONNECTION_STRING"
      }
  only:
    - staging
